name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt
          npm ci --prefix frontend
          scripts/install-ci-tools.sh
      - run: scripts/check.sh
      - run: helm lint charts/audience-simulator
      - run: docker build -t audience-simulator:smoke .
      - run: scripts/smoke-container.sh audience-simulator:smoke
      - run: scripts/smoke-kind.sh audience-simulator:smoke
