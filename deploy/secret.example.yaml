# Documentation only. Generate real credentials outside this repository,
# seal them in your deployment repository, and reference the resulting Secret.
apiVersion: v1
kind: Secret
metadata:
  name: audience-simulator
type: Opaque
stringData:
  MEETING_PASSWORD: ""
  ADMIN_PASSWORD: ""
  METRICS_TOKEN: "" # Dedicated bearer token for /metrics; empty disables scraping.
  PROVIDER_ENCRYPTION_KEY: "" # Fernet key, keep stable and back up separately from the data volume.
  # Enter provider API keys through Admin > Models and providers > Providers.
